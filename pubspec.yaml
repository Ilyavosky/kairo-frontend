name: kairo
description: Asistente para organizar la carga académica, el tiempo y las metas personales.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^4.1.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: any
  json_annotation: ^4.12.0
  receive_sharing_intent: ^1.9.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.10.5
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.11.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
